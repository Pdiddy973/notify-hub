name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build
        run: |
          npm pkg set version="${TAG#v}"
          npm run build

      - name: Stage the release with production dependencies
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp package.json package-lock.json "$stage/"
          for pkg in shared server web; do
            mkdir -p "$stage/$pkg"
            cp "$pkg/package.json" "$stage/$pkg/"
          done
          cp -r shared/dist "$stage/shared/"
          cp -r server/dist server/migrations "$stage/server/"
          cp -r web/dist "$stage/web/"
          cp -r scripts "$stage/"
          chmod +x "$stage"/scripts/*.sh
          (cd "$stage" && npm ci --omit=dev)

      - name: Pack the tarball and checksum
        run: |
          name="notify-hub-$TAG.tar.gz"
          tar -czf "$name" -C "$RUNNER_TEMP/stage" .
          sha256sum "$name" > "$name.sha256"
          cat "$name.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "notify-hub-$TAG.tar.gz" "notify-hub-$TAG.tar.gz.sha256" "${flags[@]}"
